name: Website

# The Pages workflow builds the site only when it deploys from master. This
# one builds it for every change to the site or its pages, and the build
# fails on a broken internal link.
on:
  push:
    branches: [develop]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/website.yaml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/website.yaml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The Astro CLI runs on Node, which Astro 7 needs at 22.23.4 or later.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
      - name: Install dependencies
        working-directory: ./website
        run: bun install --frozen-lockfile
      - name: Build and check internal links
        working-directory: ./website
        run: bun run build
