name: Lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v4
        with:
          version-file: requirements.dev.txt
          args: "check"
      - uses: astral-sh/ruff-action@v4
        with:
          version-file: requirements.dev.txt
          args: "format --check"
