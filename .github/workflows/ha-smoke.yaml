name: Smoke test against upcoming Home Assistant

# The tests run against the Home Assistant the lock file pins. This boots the
# integration in the Home Assistant images of the coming releases instead, so
# a removal Better Thermostat depends on shows up before users install it.
# It never blocks a pull request except one that changes the smoke test.

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ha_smoke.py
      - .github/workflows/ha-smoke.yaml

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.line }} on Home Assistant ${{ matrix.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # 1.9 is the line users run until 2.0 is released.
        line: [develop, "1.9"]
        tag: [stable, beta, dev]

    steps:
      - name: Check out the smoke test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the line under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # A pull request tests its own integration on the develop row.
          ref: ${{ (github.event_name == 'pull_request' && matrix.line == 'develop') && github.sha || matrix.line }}
          path: under-test

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.14"

      - name: Boot Home Assistant twice
        run: >-
          uv run --no-project python scripts/ha_smoke.py
          --tag "$TAG"
          --integration under-test/custom_components/better_thermostat
          | tee smoke.log
        env:
          TAG: ${{ matrix.tag }}

      - name: Open an issue
        if: failure() && github.event_name == 'schedule' && github.repository == 'KartoffelToby/better_thermostat'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Smoke test: ${{ matrix.line }} fails on Home Assistant ${{ matrix.tag }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One open issue per line and tag; a failure that is already
          # reported adds nothing until that issue is closed.
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json title --jq '.[].title' | grep -qxF "$TITLE"; then
            exit 0
          fi
          {
            echo "The nightly smoke test failed: $RUN_URL"
            echo
            echo '```'
            cat smoke.log
            echo '```'
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
