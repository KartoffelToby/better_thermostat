name: Lint

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Set up uv (install cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      # --only-group dev installs the lint tools without Home Assistant;
      # every lint tool lives in that group, pinned by uv.lock.
      - name: ruff check
        run: uv run --locked --only-group dev ruff check
      - name: ruff format --check
        run: uv run --locked --only-group dev ruff format --check
      # BLE001 is silenced per file in pyproject.toml, so `ruff check` above
      # says nothing about those files. This is what caps them.
      - name: Check the blind exception handler budget
        run: uv run --locked --only-group dev python scripts/blind_except_budget.py check
      # The glossary in glossary.toml replaces spellings the tree still
      # carries. This caps them per file, so no new one arrives while the
      # existing ones are worked off.
      - name: Check the rejected name budget
        run: uv run --locked --only-group dev python scripts/check_naming.py check
      - name: yamllint
        run: uv run --locked --only-group dev yamllint --strict .
