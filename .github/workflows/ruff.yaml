name: Lint

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv (install cache)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      # --only-group dev installs the lint tools without Home Assistant;
      # every lint tool lives in that group, pinned by uv.lock.
      - name: ruff check
        run: uv run --locked --only-group dev ruff check
      - name: ruff format --check
        run: uv run --locked --only-group dev ruff format --check
      # BLE001 is silenced per file in pyproject.toml, so `ruff check` above
      # says nothing about those files. This is what caps them.
      - name: Check the blind exception handler budget
        run: uv run --locked --only-group dev python scripts/blind_except_budget.py check
      # glossary.toml lists the spellings each term replaces. The tree carries
      # none of them, so this fails on the first one anywhere.
      - name: Check for rejected names
        run: uv run --locked --only-group dev python scripts/check_naming.py check
      # Ruff accepts the control-theory notation everywhere and ignores
      # `noqa`-silenced names. This holds every name to the exceptions
      # pyproject.toml declares, by name and by place.
      - name: Check the PEP 8 naming exceptions
        run: uv run --locked --only-group dev python scripts/pep8_naming_exceptions.py check
      # A test docstring that retells the code pins the behaviour it found,
      # which the suite cannot notice: the test is green either way. This caps
      # the summaries where that question is still open.
      - name: Check the restated contract budget
        run: uv run --locked --only-group dev python scripts/restated_contracts.py check
      - name: yamllint
        run: uv run --locked --only-group dev yamllint --strict .
