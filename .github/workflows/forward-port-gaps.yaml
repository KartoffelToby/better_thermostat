name: Forward-port gaps

# The next major version ships as a pull request from develop to master, and
# it may not ship while the maintenance line still holds work that never
# reached develop. A patch release of the maintenance line targets master too,
# and it is the one head this gate lets through: the commits it releases are
# the commits the report would name.
#
# The job runs on every pull request to master and decides inside itself. A
# job held back by its own `if:` reports as skipped, and a skipped job counts
# as a passing required status check, so a head branch nobody anticipated
# would clear the gate without it ever running. Deciding in a step keeps the
# conclusion a real one and puts the reason in the log.
#
# Blind spot: master is also advanced by pushing a merge of the maintenance
# line straight to it. That path has no pull request, and no gate on one sees
# it.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gaps:
    name: Maintenance line carried forward
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          # The comparison walks both lines commit by commit and reads each
          # touched file's parent revision, so a shallow clone has nothing
          # to read.
          fetch-depth: 0
      - name: Fetch both release lines
        run: >-
          git fetch --no-tags --force origin
          develop:refs/remotes/origin/develop
          1.9:refs/remotes/origin/1.9
      - name: Set up uv (install cache)
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      # A manual run has no head ref, which is the head this gate applies to.
      #
      # The head branch name alone does not identify the maintenance line: a
      # pull request from any fork carries whatever name that fork's branch
      # has, so a fork branch called `1.9` would wave itself through. The
      # branch this repository releases from lives in this repository, so the
      # head has to come from here too.
      - name: Check that the maintenance line is carried forward
        if: >-
          ${{ !(github.head_ref == '1.9'
          && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: >-
          uv run --locked --only-group dev
          python scripts/forward_port_gaps.py check
          --maintenance origin/1.9 --development origin/develop
      - name: Say why the check does not apply
        if: >-
          ${{ github.head_ref == '1.9'
          && github.event.pull_request.head.repo.full_name == github.repository }}
        run: >-
          echo "A release of the maintenance line ships the commits this
          report names. Run the workflow by hand to see them anyway."
