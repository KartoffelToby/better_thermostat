[project]
name = "better-thermostat"
version = "2.0.0-Beta"  # keep in sync with manifest.json
description = "Better Thermostat — Home Assistant custom integration for smart TRV control"
requires-python = ">=3.14.2"  # floor inherited from Home Assistant 2026.9.x
dependencies = ["homeassistant>=2026.9.0"]

[dependency-groups]
dev = [
    "daqp>=0.10.3",  # speeds up the MPC v2 QP; a NumPy solver runs without it
    "pytest>=9",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",  # the per-module coverage floors in CI depend on it
    "pytest-homeassistant-custom-component>=0.13.367",
    "pre-commit>=4.6.2",
    "pyrefly>=1.3.2",
    "ruff>=0.16.10",
    "yamllint>=1.38.0",
    "hypothesis>=6.168.4",
]

[tool.uv]
package = false  # HA custom integration, not an installable package

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".venv",
    ".git",
    ".tox",
    "docs",
    "venv",
    "bin",
    "lib",
    "deps",
    "build",
    "__pycache__",
    "assets",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "UP",     # pyupgrade
    "D",      # pydocstyle (docstrings)
    "D417",   # Require documented args to match the signature (numpy convention disables this by default)
    "C4",     # flake8-comprehensions
    "BLE001", # flake8-blind-except: broad `except Exception` that neither re-raises nor logs the exception
    "PL",     # pylint
    "RUF100", # unused noqa directives
    "I",      # isort
    "N",      # pep8-naming
]
ignore = [
    "E501",   # Line too long - handled by formatter where possible
    "E203",   # Whitespace before ':' - conflicts with black/ruff formatter
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D202",   # No blank lines allowed after function docstring
    "PLR2004", # Magic value comparison
    "PLR0915", # Too many statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0917", # Too many positional arguments
    "PLR0911", # Too many return statements
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test code does not need docstrings on every function/class/method, and it
# imports inside function bodies.
"tests/**" = ["D", "PLC0415"]

# Control-theory notation. The state-space matrices `A` and `B`, the Kalman
# covariance `P` and gain `K`, the process and measurement noise `Q` and `R`
# and the horizon length `N` are single symbols lifted from the derivations
# that sit in the docstrings beside them. Lowercasing them separates the code
# from the equations it implements, which is the case PEP 8 itself makes for
# dropping the convention. Class names, exception suffixes, module names and
# import aliases stay under it either way.
#
# Each entry drops only the rules that actually fire under it, so a rule no
# file there trips is not disarmed for the files that arrive later, and
# `.pep8-naming-budget.json` caps how many findings the entries hide. A glob
# says where a deviation is allowed; the budget says how many there are, and
# `scripts/pep8_naming_budget.py check` holds that number. An inline
# `# noqa: N8xx` counts the same, which is what makes it the better form where
# one line rather than a tree carries the notation.
#
# This is about case alone. The vocabulary half is judged by
# `scripts/check_naming.py` against `glossary.toml` in these paths as well, so
# the notation may not use a spelling the glossary rejects, such as `delta_T`.
"custom_components/better_thermostat/utils/calibration/**" = ["N803", "N806", "N815"]
"tests/benchmark/**" = ["N802", "N803", "N806", "N815"]
"tests/unit/mpc_v2/**" = ["N803", "N806"]
"tests/unit/test_mpc_comprehensive.py" = ["N802", "N803", "N806"]

# Device model names as module names. `load_model_quirks` sanitises the model
# string the device registry reports and imports the module of that name, so a
# file name under `model_fixes` is a lookup key rather than a name anybody
# chose. `_QUIRK_MODULE_ALIASES` in `model_quirks.py` redirects a model to
# another model's module; snake_case module names would turn that one-line
# redirect into an entry per supported device. The budget records the fourteen
# files that trip the rule today, so a fifteenth is not exempt for free.
"custom_components/better_thermostat/model_fixes/**" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.better_thermostat", "tests"]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Seconds a single test may run. The slowest takes about ten; a hung one
# fails with its traceback instead of running into the CI job's limit.
timeout = 120
filterwarnings = [
    # Upstream Home Assistant warning triggered during test imports.
    "ignore:Inheritance class HomeAssistantApplication from web\\.Application is discouraged:DeprecationWarning",
    # A coroutine nobody awaits is work that silently never ran: a fixture
    # that swapped a production object for a mock, or a call that lost its
    # await.
    "error:coroutine .* was never awaited:RuntimeWarning",
    # Python reports that warning while it collects the coroutine, where
    # nothing can raise it, and pytest passes it on in this wrapper.
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
# Branch coverage names the guards that only ever run one way: a condition
# whose true and false side are not both reached shows up as a partial
# branch, and that missing side is the test the suite does not have.
branch = true
source = ["custom_components/better_thermostat"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]

[tool.pyright]
# Don't use include - it changes the root! Instead, exclude everything except custom_components
exclude = [
    "tests",
    "docs",
    "scripts",
    "blueprints",
    "_sass",
    "assets",
    "**/__pycache__",
    ".git",
    ".venv",
    "*.md",
    "*.yml",
    "*.yaml",
]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.14"

[tool.pyrefly]
python-version = "3.14"
project-includes = ["custom_components/better_thermostat"]
min-severity = "error"
errors = { implicit-any-parameter = true, implicit-any-attribute = true, implicit-any-type-argument = true, implicit-any-empty-container = true, missing-override-decorator = true }

# Every file under project-includes is checked at the strictness declared above.
# The entries below name the files that do not meet it yet and list exactly the
# rules each one is exempt from; a rule not listed applies to that file too.
# The list only ever shrinks: an entry is removed once its file is annotated,
# and no new entry is added — a new file is strict from the start. That shape is
# held by tests/gates/test_type_strictness_exemptions.py.

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/calibration.py"
errors = { implicit-any-parameter = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/climate.py"
errors = { implicit-any-parameter = false, implicit-any-attribute = false, implicit-any-type-argument = false, implicit-any-empty-container = false, missing-override-decorator = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/events/cooler.py"
errors = { implicit-any-parameter = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/events/temperature.py"
errors = { implicit-any-parameter = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/events/trv.py"
errors = { implicit-any-parameter = false, implicit-any-type-argument = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/number.py"
errors = { bad-override-mutable-attribute = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/utils/controlling.py"
errors = { implicit-any-parameter = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/utils/helpers.py"
errors = { implicit-any-parameter = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/utils/watcher.py"
errors = { implicit-any-parameter = false, implicit-any-type-argument = false, implicit-any-empty-container = false }

[[tool.pyrefly.sub-config]]
matches = "custom_components/better_thermostat/utils/weather.py"
errors = { implicit-any-parameter = false, implicit-any-attribute = false, implicit-any-empty-container = false }
