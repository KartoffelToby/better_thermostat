rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow:
    status: todo
    comment: |
      Every field carries a data_description, but the whole configuration
      lives in entry.data; the settings the options flow changes belong in
      entry.options.
  config-flow-test-coverage:
    status: todo
    comment: config_flow.py is covered to 82 %; the rule asks for 100 %.
  dependency-transparency: done
  docs-actions: done
  docs-conditions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: |
      Better Thermostat connects to no device or service of its own; it drives
      other integrations' entities, which may come up after it on a boot. A
      thermostat that is late is waited for without a message and one that
      stays away is named in a repair issue, so the entry is set up either
      way instead of failing with ConfigEntryNotReady.
  unique-config-entry: done
