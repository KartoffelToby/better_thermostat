rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup:
    status: exempt
    comment: |
      Better Thermostat connects to no device or service of its own; it drives
      other integrations' entities, which may come up after it on a boot. A
      thermostat that is late is waited for without a message and one that
      stays away is named in a repair issue, so the entry is set up either
      way instead of failing with ConfigEntryNotReady.
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      Better Thermostat holds no credentials: it drives other integrations'
      entities inside Home Assistant and signs in to no device or service.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: |
      Better Thermostat drives thermostats and sensors that other integrations
      already provide; there is no device of its own on the network to find.
  discovery-update-info:
    status: exempt
    comment: |
      Nothing is discovered, so there is no network address to keep current.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      An entry has exactly one device, the Better Thermostat it sets up. The
      thermostats it drives are devices of their own integrations, which add
      them; a thermostat added in the options reloads the entry.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: |
      Every setting of an entry is an option, changed in the options flow; the
      entry's data is empty, so there is nothing left to reconfigure.
  repair-issues: done
  stale-devices:
    status: exempt
    comment: |
      An entry has exactly one device, which goes with the entry. The
      thermostats it drives belong to other integrations, which remove them.

  # Platinum
  async-dependency:
    status: exempt
    comment: |
      The one requirement, numpy, computes and does no I/O, so there is
      nothing for it to await.
  inject-websession:
    status: exempt
    comment: |
      Better Thermostat makes no HTTP requests.
  strict-typing: todo
